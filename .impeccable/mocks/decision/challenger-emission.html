<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Emission line</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body { color: #E8E3D6; font-family: "Helvetica Neue", Arial, sans-serif;
    background-color: #14171A;
    background-image: repeating-linear-gradient(180deg,
      rgba(255,255,255,.022) 0px, rgba(255,255,255,.022) 1px,
      rgba(0,0,0,.05) 1px, rgba(0,0,0,.05) 3px);
    display: flex; flex-direction: column; }
  .k, .amount { font-variant-numeric: tabular-nums; }

  .top { height: 54px; padding: 12px 16px 0; display: flex; align-items: center; justify-content: space-between;
    font-size: 9px; letter-spacing: .2em; text-transform: uppercase; }
  .back, .gear { color: #8B8F8C; }
  .seg { display: flex; gap: 12px; }
  .seg b { font-weight: 400; color: #666B68; letter-spacing: .2em; }
  .seg b.on { color: #E8E3D6; border-bottom: 1px solid #D8B647; padding-bottom: 2px; }

  .grid { flex: 1; padding: 14px 16px 0; display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 3px; align-content: start; }
  .cat { height: 42px; background: #1B1F23; border-left: 1px solid #3A4045; display: flex; align-items: center;
    padding: 0 7px; }
  .cat span { font-size: 9px; letter-spacing: .06em; text-transform: uppercase; color: #B9B5A9;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat.on { background: #20252A; border-left: 3px double #D8B647; }
  .cat.on span { color: #E8E3D6; }

  .foot { padding: 0 16px 12px; }
  .labels { height: 15px; display: flex; justify-content: flex-end; gap: 12px;
    font-size: 8px; letter-spacing: .22em; text-transform: uppercase; color: #6E7370; }
  .labels b { color: #D8B647; font-weight: 400; }
  .amount { text-align: right; font-size: 36px; font-weight: 300; letter-spacing: .01em; line-height: 1.05; }
  .amount em { font-style: normal; font-size: 10px; letter-spacing: .26em; color: #7C817E; margin-right: 7px; }
  .plot { margin-top: 5px; height: 7px; border-top: 1px solid #6E7370; border-bottom: 1px solid #6E7370; }
  .plot i { display: block; height: 1px; background: #D8B647; width: 38%; margin: 2px 0 0 0; }
  .remark { text-align: right; font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
    color: #7C817E; padding-top: 5px; }

  .keys { margin-top: 8px; display: grid; grid-template-columns: repeat(3, 1fr) 38px 84px; gap: 3px; }
  .k { height: 50px; display: grid; place-items: center; font-size: 22px; font-weight: 300; color: #E8E3D6; }
  .k.o { font-size: 16px; color: #7C817E; }
  .k.b { font-size: 12px; color: #7C817E; }
  .go { width: 36px; height: 36px; margin: auto; display: grid; place-items: center; font-size: 13px;
    color: #14171A; background: #D8B647; }
  .go2 { margin: auto; font-size: 11px; color: #7C817E; }
  .chip { height: 24px; margin: auto 0; border: 1px solid #3A4045; display: flex; align-items: center;
    padding: 0 6px; font-size: 8px; letter-spacing: .16em; text-transform: uppercase; color: #B9B5A9;
    white-space: nowrap; overflow: hidden; }
  .chip u { text-decoration: none; color: #6E7370; margin-right: 4px; }
</style></head>
<body>
  <div class="top">
    <div class="back">‹</div>
    <div class="seg"><b class="on">Expense</b><b>Income</b><b>Transfer</b></div>
    <div class="gear">⚙</div>
  </div>

  <div class="grid">
    <div class="cat on"><span>Groceries</span></div>
    <div class="cat"><span>Dining out</span></div>
    <div class="cat"><span>Transport</span></div>
    <div class="cat"><span>Petrol</span></div>
    <div class="cat"><span>Bills</span></div>
    <div class="cat"><span>Mobile plan</span></div>
    <div class="cat"><span>Health</span></div>
    <div class="cat"><span>Household</span></div>
    <div class="cat"><span>Shopping</span></div>
    <div class="cat"><span>Kids</span></div>
    <div class="cat"><span>Gifts</span></div>
    <div class="cat"><span>Fees</span></div>
    <div class="cat"><span>Savings</span></div>
    <div class="cat"><span>Insurance</span></div>
    <div class="cat"><span>Other</span></div>
  </div>

  <div class="foot">
    <div class="labels"><b>Pending</b><span>Receipt</span></div>
    <div class="amount"><em>RM</em>32.40</div>
    <div class="plot"><i></i></div>
    <div class="remark">Lunch with Aisyah</div>

    <div class="keys">
      <div class="k">1</div><div class="k">2</div><div class="k">3</div><div class="k o">+</div>
      <div class="chip"><u>Date</u>Today</div>
      <div class="k">4</div><div class="k">5</div><div class="k">6</div><div class="k o">−</div>
      <div class="chip"><u>Book</u>Personal</div>
      <div class="k">7</div><div class="k">8</div><div class="k">9</div><div class="k b">⌫</div>
      <div class="chip"><u>Acct</u>Maybank</div>
      <div class="k">0</div><div class="k">.</div><div class="go2">⧉</div><div class="go">✓</div>
      <div class="chip" style="justify-content:center;font-size:12px">⋯</div>
    </div>
  </div>
</body></html>
