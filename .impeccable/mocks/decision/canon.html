<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body { background: #FFFFFF; color: #111827; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  .k, .amount { font-variant-numeric: tabular-nums; }

  .top { height: 56px; padding: 12px 16px 0; display: flex; align-items: center; justify-content: space-between; }
  .back, .gear { width: 32px; height: 32px; border-radius: 50%; background: #F3F4F6; display: grid;
    place-items: center; font-size: 14px; color: #374151; }
  .seg { display: flex; background: #F3F4F6; border-radius: 999px; padding: 3px; }
  .seg b { font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: 999px; color: #6B7280; }
  .seg b.on { background: #FFFFFF; color: #111827; box-shadow: 0 1px 2px rgba(17,24,39,.10); }

  .grid { flex: 1; padding: 14px 16px 0; display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; align-content: start; }
  .cat { height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E5E7EB;
    display: flex; align-items: center; gap: 7px; padding: 0 9px; }
  .cat i { width: 22px; height: 22px; border-radius: 7px; background: #F3F4F6; flex: none; }
  .cat span { font-size: 11px; font-weight: 600; color: #374151; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .cat.on { background: #EFF4FF; border-color: #2563EB; }
  .cat.on i { background: #DCE7FF; }
  .cat.on span { color: #1D4ED8; }

  .foot { padding: 0 16px 16px; }
  .labels { height: 16px; display: flex; justify-content: flex-end; align-items: center; gap: 8px;
    font-size: 10px; font-weight: 600; color: #9CA3AF; }
  .labels b { color: #B45309; }
  .amount { text-align: right; font-size: 38px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; }
  .amount em { font-style: normal; font-size: 16px; font-weight: 600; color: #9CA3AF; margin-right: 4px; }
  .remark { text-align: right; font-size: 12px; color: #9CA3AF; padding-top: 2px; }

  .keys { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr) 42px 88px; gap: 6px; }
  .k { height: 52px; border-radius: 12px; display: grid; place-items: center; font-size: 22px;
    font-weight: 600; background: #F9FAFB; }
  .k.o { font-size: 18px; color: #6B7280; background: transparent; }
  .k.b { font-size: 14px; color: #6B7280; background: transparent; }
  .go { width: 42px; height: 42px; margin: auto; border-radius: 13px; background: #2563EB; color: #FFFFFF;
    display: grid; place-items: center; font-size: 15px; }
  .go2 { margin: auto; font-size: 13px; color: #9CA3AF; }
  .chip { height: 26px; margin: auto 0; border-radius: 8px; background: #F3F4F6; display: flex;
    align-items: center; padding: 0 8px; font-size: 10px; font-weight: 600; color: #374151;
    white-space: nowrap; overflow: hidden; }
</style></head>
<body>
  <div class="top">
    <div class="back">‹</div>
    <div class="seg"><b class="on">Expense</b><b>Income</b><b>Transfer</b></div>
    <div class="gear">⚙</div>
  </div>

  <div class="grid">
    <div class="cat on"><i></i><span>Groceries</span></div>
    <div class="cat"><i></i><span>Dining out</span></div>
    <div class="cat"><i></i><span>Transport</span></div>
    <div class="cat"><i></i><span>Petrol</span></div>
    <div class="cat"><i></i><span>Bills</span></div>
    <div class="cat"><i></i><span>Mobile plan</span></div>
    <div class="cat"><i></i><span>Health</span></div>
    <div class="cat"><i></i><span>Household</span></div>
    <div class="cat"><i></i><span>Shopping</span></div>
    <div class="cat"><i></i><span>Kids</span></div>
    <div class="cat"><i></i><span>Gifts</span></div>
    <div class="cat"><i></i><span>Fees</span></div>
    <div class="cat"><i></i><span>Savings</span></div>
    <div class="cat"><i></i><span>Insurance</span></div>
    <div class="cat"><i></i><span>Other</span></div>
  </div>

  <div class="foot">
    <div class="labels"><b>Pending</b><span>·</span><span>Receipt</span></div>
    <div class="amount"><em>RM</em>32.40</div>
    <div class="remark">Lunch with Aisyah</div>

    <div class="keys">
      <div class="k">1</div><div class="k">2</div><div class="k">3</div><div class="k o">+</div>
      <div class="chip">Today</div>
      <div class="k">4</div><div class="k">5</div><div class="k">6</div><div class="k o">−</div>
      <div class="chip">Personal</div>
      <div class="k">7</div><div class="k">8</div><div class="k">9</div><div class="k b">⌫</div>
      <div class="chip">Maybank</div>
      <div class="k">0</div><div class="k">.</div><div class="go2">⧉</div><div class="go">✓</div>
      <div class="chip" style="justify-content:center;font-size:15px">⋯</div>
    </div>
  </div>
</body></html>
