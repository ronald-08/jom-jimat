<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Syiling</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body { background: #F1F2EF; color: #16181A;
    font-family: "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; }
  .num { font-variant-numeric: tabular-nums; }

  /* struck edge: one hairline of light above, one of shadow below, no gradient */
  .struck { box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -1px 0 rgba(22,24,26,.09); }

  .top { height: 58px; padding: 14px 16px 0; display: flex; align-items: center; justify-content: space-between; }
  .back, .gear { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(22,24,26,.12);
    background: #FAFAF7; display: grid; place-items: center; font-size: 13px; }
  .seg { display: flex; border: 1px solid rgba(22,24,26,.14); border-radius: 3px; overflow: hidden; background: #EDEEEA; }
  .seg b { font-size: 11px; letter-spacing: .04em; font-weight: 600; padding: 6px 10px; color: #6B6F72; }
  .seg b.on { background: #FAFAF7; color: #16181A; box-shadow: inset 0 -2px 0 #B08A2E; }

  .grid { flex: 1; padding: 12px 16px 0; display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 5px; align-content: start; }
  .cat { height: 42px; border-radius: 2px; background: #FAFAF7; border: 1px solid rgba(22,24,26,.10);
    display: flex; align-items: center; gap: 7px; padding: 0 8px; }
  .cat span { font-size: 10px; font-weight: 600; letter-spacing: .02em; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; color: #2A2D30; }
  .cat i { width: 7px; height: 7px; border-radius: 50%; background: #A9B0B4; flex: none; }
  .cat.on { border-color: #B08A2E; background: #FBFAF4;
    box-shadow: inset 0 1px 0 #FFFFFF, inset 0 -2px 0 #B08A2E; }
  .cat.on span { color: #6E5310; }
  .cat.on i { background: #B08A2E; }

  .foot { padding: 0 16px 14px; }
  .labels { height: 15px; display: flex; justify-content: flex-end; gap: 8px;
    font-size: 8.5px; letter-spacing: .14em; text-transform: uppercase; color: #7C8083; }
  .amount { text-align: right; font-size: 40px; font-weight: 800; letter-spacing: -.035em; line-height: 1.1; }
  .amount em { font-style: normal; font-size: 14px; font-weight: 600; letter-spacing: .06em; color: #6B6F72; margin-right: 5px; }
  .rule { height: 10px; margin: 4px 0 0; border-top: 1px solid rgba(22,24,26,.16);
    border-bottom: 1px solid rgba(22,24,26,.06); }
  .remark { text-align: right; font-size: 10.5px; letter-spacing: .02em; color: #6B6F72; padding: 4px 0 0; }

  .keys { margin-top: 8px; display: grid; grid-template-columns: repeat(3, 1fr) 38px 82px; gap: 4px; }
  .k { height: 52px; display: grid; place-items: center; font-size: 21px; font-weight: 500;
    font-variant-numeric: tabular-nums; }
  .k.o { font-size: 16px; color: #7C8083; }
  .k.b { font-size: 13px; color: #7C8083; }
  .go { width: 38px; height: 38px; margin: auto; border-radius: 50%; background: #B08A2E; color: #FFFDF7;
    display: grid; place-items: center; font-size: 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(0,0,0,.18); }
  .go2 { width: 30px; height: 30px; margin: auto; border-radius: 50%; border: 1px solid rgba(22,24,26,.24);
    display: grid; place-items: center; font-size: 11px; color: #3A3D40; }
  .chip { height: 26px; margin: auto 0; border-radius: 2px; border: 1px solid rgba(22,24,26,.12);
    background: #FAFAF7; display: flex; align-items: center; gap: 6px; padding: 0 7px;
    font-size: 9.5px; font-weight: 600; letter-spacing: .02em; color: #2A2D30; white-space: nowrap; }
  .chip b { font-weight: 600; color: #6B6F72; }
</style></head>
<body>
  <div class="top">
    <div class="back">‹</div>
    <div class="seg"><b class="on">Expense</b><b>Income</b><b>Transfer</b></div>
    <div class="gear">⚙</div>
  </div>

  <div class="grid">
    <div class="cat on"><i></i><span>Groceries</span></div>
    <div class="cat"><i></i><span>Dining out</span></div>
    <div class="cat"><i></i><span>Transport</span></div>
    <div class="cat"><i></i><span>Petrol</span></div>
    <div class="cat"><i></i><span>Bills</span></div>
    <div class="cat"><i></i><span>Mobile plan</span></div>
    <div class="cat"><i></i><span>Health</span></div>
    <div class="cat"><i></i><span>Household</span></div>
    <div class="cat"><i></i><span>Shopping</span></div>
    <div class="cat"><i></i><span>Kids</span></div>
    <div class="cat"><i></i><span>Gifts</span></div>
    <div class="cat"><i></i><span>Fees</span></div>
    <div class="cat"><i></i><span>Savings</span></div>
    <div class="cat"><i></i><span>Insurance</span></div>
    <div class="cat"><i></i><span>Other</span></div>
  </div>

  <div class="foot">
    <div class="labels"><span>Pending</span><span>Receipt</span></div>
    <div class="amount"><em>RM</em>32.40</div>
    <div class="rule"></div>
    <div class="remark">Lunch with Aisyah</div>

    <div class="keys">
      <div class="k">1</div><div class="k">2</div><div class="k">3</div><div class="k o">+</div>
      <div class="chip">Today</div>
      <div class="k">4</div><div class="k">5</div><div class="k">6</div><div class="k o">−</div>
      <div class="chip"><b>Book</b> Personal</div>
      <div class="k">7</div><div class="k">8</div><div class="k">9</div><div class="k b">⌫</div>
      <div class="chip"><b>Acct</b> Maybank</div>
      <div class="k">0</div><div class="k">.</div><div class="go2">⧉</div><div class="go">✓</div>
      <div class="chip" style="justify-content:center;font-size:13px">⋯</div>
    </div>
  </div>
</body></html>
