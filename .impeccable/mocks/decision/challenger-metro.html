<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Metro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 390px; height: 844px; overflow: hidden; }
  body { background: #000000; color: #FFFFFF; font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; }
  .k, .amount { font-variant-numeric: tabular-nums; }

  .top { height: 54px; padding: 12px 16px 0; display: flex; align-items: center; justify-content: space-between; }
  .back, .gear { font-size: 15px; color: #FFFFFF; }
  .seg { display: flex; gap: 16px; font-size: 15px; font-weight: 300; letter-spacing: -.01em; }
  .seg b { font-weight: 300; color: rgba(255,255,255,.42); }
  .seg b.on { color: #00C8E0; }

  .grid { flex: 1; padding: 14px 12px 0; display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 3px; align-content: start; }
  .cat { height: 44px; background: #111111; display: flex; align-items: center; padding: 0 9px; }
  .cat span { font-size: 12px; font-weight: 300; letter-spacing: -.01em; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .cat.on { background: #00C8E0; }
  .cat.on span { color: #000000; font-weight: 400; }

  .foot { padding: 0 12px 10px; }
  .labels { height: 16px; display: flex; justify-content: flex-end; gap: 10px;
    font-size: 11px; font-weight: 300; letter-spacing: .02em; color: #7A7A7A; }
  .labels b { color: #E8FF3A; font-weight: 400; }
  .amount { text-align: right; font-size: 58px; font-weight: 200; letter-spacing: -.045em; line-height: .98; }
  .amount em { font-style: normal; font-size: 15px; font-weight: 300; color: #7A7A7A; margin-right: 6px;
    letter-spacing: .04em; }
  .remark { text-align: right; font-size: 12px; font-weight: 300; color: #7A7A7A; padding-top: 4px; }

  .keys { margin-top: 6px; display: grid; grid-template-columns: repeat(3, 1fr) 40px 84px; gap: 2px; }
  .k { height: 50px; display: grid; place-items: center; font-size: 24px; font-weight: 300; }
  .k.o { font-size: 19px; color: #00C8E0; }
  .k.b { font-size: 14px; color: #7A7A7A; }
  .go { width: 40px; height: 40px; margin: auto; display: grid; place-items: center; font-size: 15px;
    background: #00C8E0; color: #000000; font-weight: 400; }
  .go2 { font-size: 13px; color: #7A7A7A; margin: auto; }
  .chip { height: 25px; margin: auto 0; display: flex; align-items: center; padding: 0 7px;
    font-size: 11px; font-weight: 300; color: #B4B4B4; background: #111111;
    white-space: nowrap; overflow: hidden; }
</style></head>
<body>
  <div class="top">
    <div class="back">‹</div>
    <div class="seg"><b class="on">expense</b><b>income</b><b>transfer</b></div>
    <div class="gear">⚙</div>
  </div>

  <div class="grid">
    <div class="cat on"><span>groceries</span></div>
    <div class="cat"><span>dining out</span></div>
    <div class="cat"><span>transport</span></div>
    <div class="cat"><span>petrol</span></div>
    <div class="cat"><span>bills</span></div>
    <div class="cat"><span>mobile plan</span></div>
    <div class="cat"><span>health</span></div>
    <div class="cat"><span>household</span></div>
    <div class="cat"><span>shopping</span></div>
    <div class="cat"><span>kids</span></div>
    <div class="cat"><span>gifts</span></div>
    <div class="cat"><span>fees</span></div>
    <div class="cat"><span>savings</span></div>
    <div class="cat"><span>insurance</span></div>
    <div class="cat"><span>other</span></div>
  </div>

  <div class="foot">
    <div class="labels"><b>pending</b><span>receipt</span></div>
    <div class="amount"><em>RM</em>32.40</div>
    <div class="remark">lunch with aisyah</div>

    <div class="keys">
      <div class="k">1</div><div class="k">2</div><div class="k">3</div><div class="k o">+</div>
      <div class="chip">today</div>
      <div class="k">4</div><div class="k">5</div><div class="k">6</div><div class="k o">−</div>
      <div class="chip">personal</div>
      <div class="k">7</div><div class="k">8</div><div class="k">9</div><div class="k b">⌫</div>
      <div class="chip">maybank</div>
      <div class="k">0</div><div class="k">.</div><div class="go2">⧉</div><div class="go">✓</div>
      <div class="chip" style="justify-content:center;font-size:15px">⋯</div>
    </div>
  </div>
</body></html>
